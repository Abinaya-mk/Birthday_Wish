
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For ..... ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(ellipse at center, rgba(255, 0, 0, 0.25), transparent 65%),
        linear-gradient(135deg, #050505, #270000, #080808, #500000);
    font-family: 'Trebuchet MS', sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
}

/* Animated red neon background */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 20%,
        rgba(255, 0, 0, 0.15) 70%,
        rgba(255, 0, 0, 0.3) 100%
    );
    animation: backgroundPulse 3s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
}

@keyframes backgroundPulse {
    from {
        opacity: 0.4;
    }
    to {
        opacity: 1;
    }
}

/* Spiderweb background */

.web {
    position: fixed;
    width: 260px;
    height: 260px;
    opacity: 0.7;
    pointer-events: none;
    background:
        repeating-conic-gradient(
            from 0deg,
            transparent 0deg 14deg,
            rgba(255, 40, 40, 0.9) 14.3deg 14.7deg,
            transparent 15deg 45deg
        ),
        repeating-radial-gradient(
            circle,
            transparent 0 24px,
            rgba(255, 50, 50, 0.8) 25px 26px,
            transparent 27px 42px
        );

    filter: drop-shadow(0 0 5px red)
            drop-shadow(0 0 12px red);

    mask-image: radial-gradient(circle at top left, black, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at top left, black, transparent 72%);

    animation: webGlow 2s ease-in-out infinite alternate;
}

.web.top-left {
    top: 0;
    left: 0;
}

.web.top-right {
    top: 0;
    right: 0;
    transform: scaleX(-1);
}

.web.bottom-left {
    bottom: 0;
    left: 0;
    transform: scaleY(-1);
}

.web.bottom-right {
    bottom: 0;
    right: 0;
    transform: scale(-1);
}

@keyframes webGlow {
    from {
        opacity: 0.35;
        filter: drop-shadow(0 0 3px red);
    }
    to {
        opacity: 0.85;
        filter: drop-shadow(0 0 12px red)
                drop-shadow(0 0 20px #ff2020);
    }
}

/* Red glowing background lights */

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    background: #ff0000;
    filter: blur(130px);
    opacity: 0.3;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    animation: lightPulse 3s ease-in-out infinite alternate;
}

@keyframes lightPulse {
    from {
        opacity: 0.15;
        transform: scale(0.8);
    }
    to {
        opacity: 0.4;
        transform: scale(1.3);
    }
}

.container {
    width: 100%;
    padding: 20px;
    position: relative;
    z-index: 2;
}

.intro {
    animation: fadeIn 2s ease;
}

.small-text {
    color: #ffffff;
    letter-spacing: 3px;
    font-size: 12px;
    margin-bottom: 20px;
    text-shadow:
        0 0 5px #ff0000,
        0 0 12px #ff0000,
        0 0 25px #ff0000;
    animation: textGlow 2s infinite alternate;
}

/* Gift box */

.gift {
    position: relative;
    width: 170px;
    height: 150px;
    margin: 70px auto 30px;
    cursor: pointer;
    animation: giftFloat 2s ease-in-out infinite;

    filter:
        drop-shadow(0 0 8px #ff0000)
        drop-shadow(0 0 18px rgba(255, 0, 0, 0.7));

    transition: filter 0.4s ease;
}

.gift:hover {
    filter:
        drop-shadow(0 0 15px #ff0000)
        drop-shadow(0 0 30px #ff2222)
        drop-shadow(0 0 50px rgba(255, 0, 0, 0.8));
}

.box {
    position: absolute;
    width: 170px;
    height: 105px;
    bottom: 0;
    background: linear-gradient(135deg, #ff3030, #8b0000);
    border: 2px solid #ff7777;
    border-radius: 5px;
    box-shadow:
        0 0 15px #ff0000,
        0 0 30px rgba(255, 0, 0, 0.7),
        inset 0 0 15px rgba(255, 255, 255, 0.2);
}

.ribbon-vertical {
    position: absolute;
    width: 28px;
    height: 105px;
    left: 71px;
    bottom: 0;
    background: white;
    box-shadow:
        0 0 8px white,
        0 0 15px rgba(255, 255, 255, 0.7);
}

.ribbon-horizontal {
    position: absolute;
    width: 170px;
    height: 18px;
    bottom: 45px;
    background: white;
    box-shadow: 0 0 12px white;
}

.lid {
    position: absolute;
    width: 190px;
    height: 35px;
    left: -10px;
    top: 10px;
    background: linear-gradient(135deg, #ff5252, #cc0000);
    border: 2px solid #ff9999;
    border-radius: 5px;
    z-index: 3;
    box-shadow:
        0 0 12px red,
        0 0 25px rgba(255, 0, 0, 0.8);
}

.bow {
    position: absolute;
    top: -20px;
    left: 58px;
    width: 55px;
    height: 30px;
    z-index: 4;
    filter: drop-shadow(0 0 8px white);
}

.bow::before,
.bow::after {
    content: "";
    position: absolute;
    width: 35px;
    height: 25px;
    border: 8px solid white;
    border-radius: 50% 50% 0 50%;
}

.bow::before {
    left: -13px;
    transform: rotate(25deg);
}

.bow::after {
    right: -13px;
    transform: rotate(65deg);
}

.click-text {
    color: white;
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow:
        0 0 5px red,
        0 0 12px red,
        0 0 25px red;
    animation: blink 1.5s infinite;
}

/* Birthday reveal */

#birthday {
    display: none;
    animation: reveal 1.5s ease forwards;
}

.spider {
    font-size: 65px;
    margin-bottom: 15px;
    animation: bounce 1.5s infinite;
    filter: drop-shadow(0 0 12px red);
}

/* Main red neon heading */

h1 {
    font-size: clamp(32px, 8vw, 58px);
    font-weight: 900;
    line-height: 1.2;
    color: #ff3030;

    text-shadow:
        0 0 5px #ffffff,
        0 0 10px #ff0000,
        0 0 20px #ff0000,
        0 0 40px #ff0000,
        0 0 70px #ff0000,
        0 0 100px #b90000;

    animation: neonPulse 1.5s ease-in-out infinite alternate;
}

.name {
    display: block;
    color: white;
    margin-top: 12px;
    letter-spacing: 5px;

    text-shadow:
        0 0 5px white,
        0 0 12px #ff0000,
        0 0 25px #ff0000,
        0 0 45px #ff0000;

    animation: nameGlow 2s ease-in-out infinite alternate;
}

.subtitle {
    margin-top: 25px;
    color: #ffffff;
    font-size: 16px;
    letter-spacing: 2px;
    line-height: 1.8;
    text-shadow:
        0 0 8px red,
        0 0 18px rgba(255, 0, 0, 0.8);
}

/* White glowing heart */

.heart {
    font-size: 36px;
    margin-top: 20px;
    color: white;

    filter:
        drop-shadow(0 0 5px white)
        drop-shadow(0 0 12px white)
        drop-shadow(0 0 25px #ff2222);

    animation: heartbeat 1s infinite;
}

/* Red neon button */

button {
    margin-top: 25px;
    background: linear-gradient(135deg, #ff2020, #9b0000);
    color: white;
    border: 1px solid white;
    border-radius: 30px;
    padding: 12px 25px;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;

    box-shadow:
        0 0 8px #ff0000,
        0 0 18px #ff0000,
        0 0 35px rgba(255, 0, 0, 0.7);

    transition: all 0.3s ease;
}

button:hover {
    background: #ff2222;
    transform: scale(1.07);

    box-shadow:
        0 0 12px #ff0000,
        0 0 30px #ff0000,
        0 0 55px #ff2222;
}

/* Floating hearts and confetti */

.particle {
    position: fixed;
    top: -30px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 5;

    filter: drop-shadow(0 0 6px red);
}

/* Animations */

@keyframes giftFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-12px);
    }
}

@keyframes blink {
    0%, 100% {
        opacity: 1;
        text-shadow: 0 0 8px red, 0 0 20px red;
    }
    50% {
        opacity: 0.5;
        text-shadow: 0 0 15px red, 0 0 35px red;
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: scale(0.5);
        filter: blur(10px);
    }
    to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
    }
}

@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.25);
    }
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

/* Neon text animations */

@keyframes neonPulse {
    from {
        text-shadow:
            0 0 5px #ff0000,
            0 0 12px #ff0000,
            0 0 25px #ff0000,
            0 0 40px #b90000;
    }

    to {
        text-shadow:
            0 0 8px white,
            0 0 15px #ff0000,
            0 0 30px #ff0000,
            0 0 55px #ff0000,
            0 0 85px #ff2222;
    }
}

@keyframes nameGlow {
    from {
        text-shadow:
            0 0 5px white,
            0 0 12px red,
            0 0 20px red;
    }

    to {
        text-shadow:
            0 0 10px white,
            0 0 20px red,
            0 0 40px red,
            0 0 60px #ff2222;
    }
}

@keyframes textGlow {
    from {
        text-shadow: 0 0 5px red, 0 0 12px red;
    }

    to {
        text-shadow: 0 0 10px red, 0 0 25px red, 0 0 35px #ff2222;
    }
}

@media (max-width: 400px) {
    .gift {
        transform: scale(0.9);
    }

    .small-text {
        letter-spacing: 2px;
    }

    .web {
        width: 180px;
        height: 180px;
    }
}
</style>
</head>

<body>

<div class="web top-left"></div>
<div class="web top-right"></div>
<div class="web bottom-left"></div>
<div class="web bottom-right"></div>

<div class="glow" style="top:-100px; left:-100px;"></div>
<div class="glow" style="bottom:-100px; right:-100px;"></div>

<div class="container">

    <div class="intro" id="intro">

        <p class="small-text">
            ✨ A LITTLE SURPRISE FOR YOU ✨
        </p>

        <div class="gift" onclick="openGift()">

            <div class="box"></div>
            <div class="ribbon-vertical"></div>
            <div class="ribbon-horizontal"></div>
            <div class="lid" id="lid"></div>
            <div class="bow" id="bow"></div>

        </div>

        <p class="click-text">
            🎁 TAP THE GIFT TO OPEN 🎁
        </p>

    </div>

    <div id="birthday">

        <div class="......"></div>

        <h1>
            HAPPY<br>
            BIRTHDAY
            <span class="name">...... 🤍</span>
        </h1>

        <p class="subtitle">
            ............................! 🎂<br>
            ........, ......! ✨
        </p>

        <div class="heart">🤍</div>

        <button onclick="celebrateAgain()">
            MORE CELEBRATION 🎉
        </button>

    </div>

</div>

<script>
let opened = false;

function openGift() {
    if (opened) return;
    opened = true;

    const lid = document.getElementById("lid");
    const bow = document.getElementById("bow");

    lid.style.transition = "transform 0.8s ease";
    lid.style.transform = "translateY(-100px) rotate(-20deg)";

    bow.style.transition = "transform 0.8s ease";
    bow.style.transform = "translateY(-100px) rotate(-20deg)";

    setTimeout(() => {
        document.getElementById("intro").style.display = "none";
        document.getElementById("birthday").style.display = "block";
        createConfetti();
    }, 900);
}

function createConfetti() {
    const symbols = ["🤍", "✨", "🎉", "🕷️", "🎊", "⭐"];

    for (let i = 0; i < 90; i++) {
        const particle = document.createElement("div");

        particle.className = "particle";
        particle.textContent = symbols[
            Math.floor(Math.random() * symbols.length)
        ];

        particle.style.left = Math.random() * 100 + "vw";
        particle.style.fontSize = (12 + Math.random() * 18) + "px";
        particle.style.animationDuration = (3 + Math.random() * 5) + "s";
        particle.style.animationDelay = Math.random() * 2 + "s";

        document.body.appendChild(particle);

        setTimeout(() => particle.remove(), 10000);
    }
}

function celebrateAgain() {
    createConfetti();
}
</script>

</body>
</html>
